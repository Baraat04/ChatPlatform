services:
  db:
    image: postgres:16-alpine
    container_name: chatplatform_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai-consultant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatplatform_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      SESSION_SECRET: prince
      BASE_URL: https://api.up-chat.com
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai-consultant?schema=public
      FRONTEND_URL: https://up-chat.com
      SMTP_USER: ashaprinc752@gmail.com
      SMTP_PASS: awkkhbepousygcbd
      ROBOKASSA_MERCHANT_LOGIN: up-chat.com
      ROBOKASSA_PASSWORD_1: uisXn74aOTqhLRa388uG
      ROBOKASSA_PASSWORD_2:  nPWN73ljjQcW3mq8M6Rk 
      ROBOKASSA_IS_TEST: "false"
      INSTAGRAM_CLIENT_ID: "3194191524101914"
      INSTAGRAM_CLIENT_SECRET: "07e4e5be4588b63de01ec895426c4963"
      INSTAGRAM_REDIRECT_URI: "https://api.up-chat.com/auth/instagram/callback"
      IG_WEBHOOK_VERIFY_TOKEN: "up_chat_verify_8f3a2k9"
      WA_APP_ID: "855410484294375"
      WA_APP_SECRET: "4fbc7cff1ae4af403c1c29feaf8b0a27"
      WA_CONFIG_ID: "1033776592591389"
      WA_SYSTEM_USER_TOKEN: "EAAMJZCcYNsucBSHemw2JImGByl2UoZBFjptb3wkRSZC3KIS5EQf5FNxVBZB6AzWr5CNZASctjYZAsCQ4BIiysdNueBMzxfeLAMPV8C270koYI07ZBFmt1suCiMZAzIhSDnA11At19QabPb2lw1HabHa1FhowU0UfQMOTuXihuOJjAfJcvHeEXu6XWT5OcJZCxRwZDZD"
      WA_WEBHOOK_VERIFY_TOKEN: "up_chat_wa_verify_9k2m4"
    volumes:
      - /docker/shared/chatplatform/sessions:/app/sessions
      - /docker/shared/chatplatform/uploads:/app/uploads
      - ./backend/google-key.json:/app/google-key.json
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.upchat-api.rule=Host(`api.up-chat.com`)"
      - "traefik.http.routers.upchat-api.entrypoints=websecure"
      - "traefik.http.routers.upchat-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.upchat-api.loadbalancer.server.port=3001"
    networks:
      - chat_network
      - traefik-proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.up-chat.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 271879614176-cmvq3gr8plp9vl2bgu6pqm3f0ra2tbhq.apps.googleusercontent.com
        NEXT_PUBLIC_INSTAGRAM_CLIENT_ID: "3194191524101914"
        NEXT_PUBLIC_INSTAGRAM_REDIRECT_URI: "https://api.up-chat.com/auth/instagram/callback"
        NEXT_PUBLIC_WA_APP_ID: "855410484294375"
        NEXT_PUBLIC_WA_CONFIG_ID: "1033776592591389"
    container_name: chatplatform_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.up-chat.com
      NEXT_PUBLIC_INSTAGRAM_CLIENT_ID: "3194191524101914"
      NEXT_PUBLIC_INSTAGRAM_REDIRECT_URI: "https://api.up-chat.com/auth/instagram/callback"
      NEXT_PUBLIC_WA_APP_ID: "855410484294375"
      NEXT_PUBLIC_WA_CONFIG_ID: "1033776592591389"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.upchat-frontend.rule=Host(`up-chat.com`) || Host(`www.up-chat.com`)"
      - "traefik.http.routers.upchat-frontend.entrypoints=websecure"
      - "traefik.http.routers.upchat-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.upchat-frontend.loadbalancer.server.port=3000"
    networks:
      - chat_network
      - traefik-proxy

networks:
  chat_network:
    driver: bridge
  traefik-proxy:
    external: true

volumes:
  postgres_data:
    name: chatplatform_postgres_data
