services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@up-chat.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - chat_network

  db:
    image: postgres:16-alpine
    container_name: chatplatform_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai-consultant
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - chat_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatplatform_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      SESSION_SECRET: prince
      BASE_URL: https://api.up-chat.com
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai-consultant?schema=public
    volumes:
      - ./backend/sessions:/app/sessions
      - ./backend/uploads:/app/uploads
      - ./backend/google-key.json:/app/google-key.json
    labels:
      - traefik.enable=true
      - traefik.docker.network=chat_network
      - traefik.http.routers.api.rule=Host(`api.up-chat.com`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=3001
    networks:
      - chat_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.up-chat.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 271879614176-cmvq3gr8plp9vl2bgu6pqm3f0ra2tbhq.apps.googleusercontent.com
    container_name: chatplatform_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.up-chat.com
    labels:
      - traefik.enable=true
      - traefik.docker.network=chat_network
      - traefik.http.routers.frontend.rule=Host(`up-chat.com`) || Host(`www.up-chat.com`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    networks:
      - chat_network

networks:
  chat_network:
    driver: bridge
